name: fixtures

# Captures real zfs, zfs allow and ps output on Linux, FreeBSD and illumos
# (OmniOS) for the parser tests (spec 14.3, 14.4). Run it by hand, or let it
# run on a pull request that changes the capture script or this workflow
# (GitHub dispatches a workflow by hand only once it is on the default
# branch). Download the fixtures-<os> artifacts and copy them into the
# testdata directories.
#
# The VM jobs always finish their run block successfully after writing the
# script's status to fixtures-out/exit_code.txt, so the VM action copies the
# output back even when the capture failed; a later step then fails the job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ci/capture-fixtures.sh
      - .github/workflows/fixtures.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install ZFS
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -q
          sudo apt-get install -y -q zfsutils-linux
          if ! sudo modprobe zfs; then
            # Some cloud kernels ship the zfs module in the extra modules package.
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe zfs
          fi
      - name: capture
        run: sudo sh scripts/ci/capture-fixtures.sh "$PWD/fixtures-out"
      - name: hand the files back to the runner user
        if: always()
        run: |
          if [ -d fixtures-out ]; then sudo chown -R "$(id -u):$(id -g)" fixtures-out; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixtures-linux
          path: fixtures-out
          if-no-files-found: warn

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: capture in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            kldstat -q -m zfs || kldload zfs
          run: |
            rc=0
            sh scripts/ci/capture-fixtures.sh "$PWD/fixtures-out" || rc=$?
            mkdir -p fixtures-out
            echo "$rc" >fixtures-out/exit_code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixtures-freebsd
          path: fixtures-out
          if-no-files-found: warn
      - name: fail when the capture failed
        run: test "$(cat fixtures-out/exit_code.txt)" = 0

  omnios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: capture in an OmniOS VM
        uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          run: |
            rc=0
            sh scripts/ci/capture-fixtures.sh "$PWD/fixtures-out" || rc=$?
            mkdir -p fixtures-out
            echo "$rc" >fixtures-out/exit_code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixtures-omnios
          path: fixtures-out
          if-no-files-found: warn
      - name: fail when the capture failed
        run: test "$(cat fixtures-out/exit_code.txt)" = 0

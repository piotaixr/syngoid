name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          # mise itself, pinned the same way in every job: the version that
          # wrote mise.lock, and the SHA-256 of its linux-x64 binary from that
          # release's signed SHASUMS256.txt.
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be
          install: true
          cache: true
      - run: mise run vet
      - run: mise run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be
          install: true
          cache: true
      - run: mise run lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be
          install: true
          cache: true
      - run: scripts/ci/setup-zfs.sh
      - name: integration tests (real ZFS)
        env:
          SYNGOID_IT: "1"
          SYNGOID_IT_INVASIVE: "1"
        run: mise run test-integration

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be
          install: true
          cache: true
      - run: mise run release-check

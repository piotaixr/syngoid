name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run vet
      - run: mise run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: scripts/ci/setup-zfs.sh
      - name: integration tests (real ZFS)
        env:
          SYNGOID_IT: "1"
          SYNGOID_IT_INVASIVE: "1"
        run: mise run test-integration

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
      - run: mise run release-check

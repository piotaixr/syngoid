[tools]
go = "1.27.1"

[tasks.build]
description = "Build the syngoid binary"
env = { CGO_ENABLED = "0" }
run = "go build -o syngoid ./cmd/syngoid"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run the unit tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run"

[tasks.check]
description = "Run vet, test and lint"
depends = ["vet", "test", "lint"]

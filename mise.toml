min_version = "2026.10.10"

[tools]
go = "1.27.1"
goreleaser = "2.19.0"
minisign = "0.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tasks.build]
description = "Build the syngoid binary"
env = { CGO_ENABLED = "0" }
run = "go build -o syngoid ./cmd/syngoid"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run the unit tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint twice: without build tags, then with the integration and releasecheck tags"
run = [
  "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run",
  "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --build-tags integration,releasecheck",
]

[tasks.test-integration]
description = "Run the integration tests against real ZFS (needs sudo)"
run = "sudo -E env PATH=$PATH go test -tags integration -v -timeout 45m ./test/integration/..."

[tasks.release-snapshot]
description = "Build an unsigned GoReleaser snapshot of every target into dist/"
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks.release-check]
description = "Build a snapshot signed with a throwaway key and verify it with syngoid's verifier"
run = "scripts/release-check.sh"

[tasks.check]
description = "Run vet, test and lint"
depends = ["vet", "test", "lint"]
